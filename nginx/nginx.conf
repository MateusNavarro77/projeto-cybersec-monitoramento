server {
  listen 80;
  server_name grafana.monitoramento-projeto-alzir-ubuntu-vps prometheus.monitoramento-projeto-alzir-ubuntu-vps;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name grafana.monitoramento-projeto-alzir-ubuntu-vps;

  ssl_certificate     /etc/nginx/certs/monitoramento.crt;
  ssl_certificate_key /etc/nginx/certs/monitoramento.key;

  location / {
    proxy_pass http://grafana:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl http2;
  server_name prometheus.monitoramento-projeto-alzir-ubuntu-vps;

  ssl_certificate     /etc/nginx/certs/monitoramento.crt;
  ssl_certificate_key /etc/nginx/certs/monitoramento.key;

  location / {
    proxy_pass http://prometheus:9090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}